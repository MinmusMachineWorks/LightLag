// RealAntennas: what LightLag delays. Format: Stock.cfg in this folder; the analysis is in
// docs/PART_MENUS.md in the LightLag repo.
LIGHTLAG_EXEMPTIONS
{
    // RealAntennas: planning, targeting and debug windows. Picking a target in the window is delayed (below).
    event = ModuleRealAntenna.AntennaPlanningGUI
    event = ModuleRealAntenna.AntennaTargetGUI
    event = ModuleRealAntenna.DebugAntenna
}

LIGHTLAG_WINDOW
{
    name = RealAntennas targeting
    // Picking a target only points the dish when the command arrives. Changing the list's mode or sort is display only.
    entry = RealAntennas.Targeting.AntennaTargetGUI.GUIDisplay
    command = RealAntennas.RealAntenna.set_Target @ Parent, Point antenna
}
