// ExtraplanetaryLaunchpads: what LightLag delays. Format: Stock.cfg in this folder; the analysis is in
// docs/PART_MENUS.md in the LightLag repo.
LIGHTLAG_EXEMPTIONS
{
    // Extraplanetary Launchpads: show, hide and rename windows. Control From Here is in Stock.cfg.
    event = ELLaunchpad.ShowUI
    event = ELLaunchpad.HideUI
    event = ELLaunchpad.ShowRenameUI
    event = ELDisposablePad.ShowUI
    event = ELDisposablePad.HideUI
    event = ELDisposablePad.ShowRenameUI
    event = ELSurveyStation.ShowUI
    event = ELSurveyStation.HideUI
    event = ELSurveyStation.ShowRenameUI
}

LIGHTLAG_WINDOW
{
    name = Extraplanetary Launchpads build window
    // Choosing a craft is planning; building, pausing, cancelling, finishing and releasing are commands.
    entry = ExtraplanetaryLaunchpads.ELBuildCraftView.BuildCraft
    entry = ExtraplanetaryLaunchpads.ELBuildView.FinalizeBuild
    entry = ExtraplanetaryLaunchpads.ELBuildView.PauseResume
    entry = ExtraplanetaryLaunchpads.ELBuildView.CancelRestart
    entry = ExtraplanetaryLaunchpads.ELTransferView.ReleaseCraft
    command = ExtraplanetaryLaunchpads.ELBuildControl.BuildCraft @ builder, Build
    command = ExtraplanetaryLaunchpads.ELBuildControl.BuildAndLaunchCraft @ builder, Finish build
    command = ExtraplanetaryLaunchpads.ELBuildControl.PauseBuild @ builder, Pause build
    command = ExtraplanetaryLaunchpads.ELBuildControl.ResumeBuild @ builder, Resume build
    command = ExtraplanetaryLaunchpads.ELBuildControl.CancelBuild @ builder, Cancel build
    command = ExtraplanetaryLaunchpads.ELBuildControl.UnCancelBuild @ builder, Restart build
    command = ExtraplanetaryLaunchpads.ELBuildControl.ReleaseVessel @ builder, Release vessel
}
