// KAS: what LightLag delays. Format: Stock.cfg in this folder; the analysis is in
// docs/PART_MENUS.md in the LightLag repo.
LIGHTLAG_EXEMPTIONS
{
    // KAS: buttons that open a window. The winch remote's commands are delayed (below); the
    // fuel transfer window's aren't, like other resource transfers.
    event = FuelMixture.OpenGuiEvent
    event = KASLinkWinch.OpenGuiEvent
    event = KASModuleWinch.ContextMenuGUI
}

LIGHTLAG_WINDOW
{
    name = KAS winch remote
    entry = KAS.ControllerWinchRemote.OnGUI
    command = KAS.KASLinkWinch.SetMotor, Winch motor
    command = KAS.KASLinkWinch.ReleaseCable, Release cable
    command = KAS.KASLinkWinch.StretchCable, Stretch cable
    command = KAS.KASLinkSourceBase.BreakCurrentLink, Detach
}
