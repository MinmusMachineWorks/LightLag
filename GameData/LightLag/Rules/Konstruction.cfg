// Konstruction: what LightLag delays. Format: Stock.cfg in this folder; the analysis is in
// docs/PART_MENUS.md in the LightLag repo.
LIGHTLAG_EXEMPTIONS
{
    // Konstruction: buttons that open a window. Their build buttons are delayed (below).
    event = AbstractKonstructorModule.ShowWindow
    event = ModuleDekonstructor.OpenWindow
    event = ModuleKonFabricator.OpenWindow
}

LIGHTLAG_WINDOW
{
    name = Konstructor
    entry = KonstructionUI.KonstructorWindow.BuildShip
    command = Konstruction.AbstractKonstructorModule.LaunchVessel, Build vessel
}

LIGHTLAG_WINDOW
{
    name = Dekonstructor
    entry = Konstruction.Fabrication.DekonstructorGUI.DrawWindowContents
    command = Konstruction.Fabrication.DekonstructorGUI.RecycleInventoryParts @ _module, Dekonstruct parts
}

LIGHTLAG_WINDOW
{
    name = KonFabricator
    entry = Konstruction.Fabrication.FabricationGUI.DrawWindowContents
    command = Konstruction.Fabrication.FabricationGUI.BuildAThing @ _module, KonFabricate
}
