// MKS: what LightLag delays. Format: Stock.cfg in this folder; the analysis is in
// docs/PART_MENUS.md in the LightLag repo.
LIGHTLAG_EXEMPTIONS
{
    // MKS: Orbital Logistics window; Kolony rewards tally (career bookkeeping).
    event = ModuleOrbitalLogistics.OpenWindow
    event = ModuleColonyRewards.CheckRewards
}

LIGHTLAG_WINDOW
{
    name = MKS Orbital Logistics
    // Start, Abort and Resume go to the origin vessel. Clearing finished transfers is bookkeeping.
    entry = KolonyTools.OrbitalLogisticsGui_CreateTransfer.DrawWindowContents
    entry = KolonyTools.OrbitalLogisticsGui_ReviewTransfer.DrawWindowContents
    command = KolonyTools.OrbitalLogisticsTransferRequest.Launch @ Origin, Start transfer
    command = KolonyTools.OrbitalLogisticsTransferRequest.Abort @ Origin, Abort transfer
}
