// Part-menu buttons (events) and controls (fields) that act at once, with no signal
// needed and no delay. Everything else in the active vessel's part menus is delayed.
//
// Entries are Class.member, where Class is the part module's class or one of its base
// classes, Part for the part's own events, or * for any class. member is the event's
// method name or the field's name.
//
// Other mods can add entries with Module Manager:
//     @LIGHTLAG_EXEMPTIONS:FOR[MyMod] { event = MyModule.OpenWindow }
// A mod can also mark an event or field with category = "skip_delay" (needs a signal,
// no delay) or "skip_control" (no checks), the markers RemoteTech uses.
LIGHTLAG_EXEMPTIONS
{
    // The analysis behind this list is in docs/PART_MENUS.md in the LightLag repo.

    // Stock: your viewpoint (Control From Here, control point, camera).
    event = *.MakeReference
    event = *.MakeReferenceTransform
    event = ModuleCommand.ChangeControlPoint
    event = Part.AimCamera
    event = Part.ResetCamera

    // Stock: windows and readouts.
    event = *.ReviewDataEvent
    event = ModuleKerbNetAccess.OpenKerbNet
    event = ModuleRoboticController.OpenControllerEditor
    event = ModuleFlightDisplay.ToggleGui
    event = ModuleOrbitalScanner.ToggleOverlay
    event = ModuleOrbitalScanner.SetColor
    event = ModuleOrbitalScanner.SwitchResource
    event = ModuleOrbitalScanner.IncreaseCutoff
    event = ModuleOrbitalScanner.DecreaseCutoff

    // Stock: names and targets.
    event = *.RenameVessel
    event = *.RenameAsteroidEvent
    event = *.RenameCometEvent
    event = ModuleGroundExpControl.SetVesselNaming
    event = ModuleAsteroid.MakeTarget
    event = ModuleComet.MakeTarget

    // Stock: crew on board.
    event = Part.SpawnTransferDialog
    event = ModuleExperienceManagement.FinalizeExperience

    // Stock: construction settings.
    event = Part.ToggleAutoStrut
    event = Part.ToggleRigidAttachment
    event = Part.RemoveFromSymmetry

    // Stock: cosmetic.
    field = ModuleServiceModule.openCutaway

    // Firespitter: help and info popups, launch-position debugging.
    event = FSinfoPopup.showInfoEvent
    event = FStrimAdjustment.togglePopupEvent
    event = FSwingBase.showHelpEvent
    event = FSwing.showHelpEvent
    event = FSmoveCraftAtLaunch.logPositionEvent
    event = FSmoveCraftAtLaunch.savePositionEvent

    // KAS: buttons that open a window. Commands sent from the window aren't delayed.
    event = FuelMixture.OpenGuiEvent
    event = KASLinkWinch.OpenGuiEvent
    event = KASModuleWinch.ContextMenuGUI

    // Konstruction: buttons that open a window.
    event = AbstractKonstructorModule.ShowWindow
    event = ModuleDekonstructor.OpenWindow
    event = ModuleKonFabricator.OpenWindow

    // MKS: Orbital Logistics window; Kolony rewards tally.
    event = ModuleOrbitalLogistics.OpenWindow
    event = ModuleColonyRewards.CheckRewards

    // Extraplanetary Launchpads: show, hide and rename windows. Control From Here is covered above.
    event = ELLaunchpad.ShowUI
    event = ELLaunchpad.HideUI
    event = ELLaunchpad.ShowRenameUI
    event = ELDisposablePad.ShowUI
    event = ELDisposablePad.HideUI
    event = ELDisposablePad.ShowRenameUI
    event = ELSurveyStation.ShowUI
    event = ELSurveyStation.HideUI
    event = ELSurveyStation.ShowRenameUI

    // RealAntennas: planning, targeting and debug windows. Targeting set in the window isn't delayed.
    event = ModuleRealAntenna.AntennaPlanningGUI
    event = ModuleRealAntenna.AntennaTargetGUI
    event = ModuleRealAntenna.DebugAntenna

    // SCANsat: Review Data.
    event = SCANexperiment.reviewEvent
}
