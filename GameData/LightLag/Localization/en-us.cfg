    {
        #LightLag_Settings_Title = Signal Delay
        #LightLag_Settings_DelayEnabled = Light-speed delay
        #LightLag_Settings_DelayEnabled_Tip = Commands to uncrewed vessels arrive after the signal crosses the control path.
        #LightLag_Settings_RoundTrip = Round-trip delay
        #LightLag_Settings_RoundTrip_Tip = Commands take effect after the signal reaches the vessel and comes back, so you see the result when telemetry would show it.
        #LightLag_Settings_LightSpeed = Speed of light multiplier
        #LightLag_Settings_LightSpeed_Tip = Scales the speed of light. Above 1 shortens every delay; below 1 lengthens it.
        #LightLag_Settings_ThrottleOnLoss = Throttle on signal loss
        #LightLag_Settings_ThrottleOnLoss_Tip = Cut: an uncrewed vessel's throttle goes to zero when it loses its signal. Hold: it keeps its last setting. Applies only with Require Signal for Control on.
        #LightLag_Readout_Delay = Signal delay <<1>>
        #LightLag_Readout_NoSignal = No signal: commands can't be sent
        #LightLag_Readout_Local = Local control: no delay
        #LightLag_Readout_NoSignalNotRequired = No signal, none required: no delay
        #LightLag_Readout_Pending = <<1>> in flight
        #LightLag_Readout_Queued = <<1>> queued
        #LightLag_Command_Stage = Stage
        #LightLag_Command_Toggle = Toggle <<1>>
        #LightLag_Command_On = <<1>> on
        #LightLag_Command_Off = <<1>> off
        #LightLag_Command_SasMode = SAS: <<1>>
        #LightLag_Error_NotActive = staging only works on the active vessel
        #LightLag_Error_SasMode = SAS can't hold <<1>> now
        #LightLag_Message_NotSent = No signal: <<1>> not sent
        #LightLag_Message_Cancelled = Cancelled: <<1>>
        #LightLag_Message_Failed = <<1>> failed: <<2>>
        #LightLag_Message_Overdue = <<1>> queued commands arrived at <<2>> while it was unloaded and ran now
        #LightLag_Queue_Title = Command queue: <<1>>
        #LightLag_Queue_NoDelay = No delay
        #LightLag_Queue_ExtraDelay = Extra delay (s)
        #LightLag_Queue_ExtraDelay_Tip = New commands run at least this long after you send them.
        #LightLag_Queue_Empty = No commands queued.
        #LightLag_Queue_Cancel = Cancel
        #LightLag_Queue_Close = Close
        #LightLag_Queue_Arrives = arrives in <<1>>, runs in <<2>>
